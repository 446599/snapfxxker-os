# Included by both the Fluidd and Mainsail server blocks.
location = /u1 {
    return 302 /u1/$is_args$args;
}
location ^~ /u1/ {
    alias /usr/local/share/u1-web/;
    index index.html;
    add_header Cache-Control "no-cache" always;
}
# Use the same setting schema, idle check, confirmation and readback as the
# native screen. The companion enforces application/json for every POST.
location = /u1/device/firmware/settings {
    if ($request_method !~ ^(GET|POST)$) { return 405; }
    set $u1_request_type "$request_method:$http_content_type";
    if ($u1_request_type ~* "^POST:(?!application/json(?:[[:space:]]*;|$))") { return 415; }
    auth_request /auth_check;
    client_max_body_size 64k;
    proxy_pass http://127.0.0.1:7136/firmware/settings;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_read_timeout 300s;
    proxy_buffering off;
    add_header Cache-Control "no-store" always;
}
