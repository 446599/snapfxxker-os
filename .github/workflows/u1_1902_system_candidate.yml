name: Build U1 233 1.90.2 system candidate
on:
  push:
    branches: [build/u1-1902-filament-save]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: u1-1902-filament-save
  cancel-in-progress: true
jobs:
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install host build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libssl-dev squashfs-tools qemu-user-static
      - name: Software composition and mapping checks
        run: |
          bash -n bundles/full-system-1902/build.sh
          python3 -m unittest discover -s bundles/full-system-1902 -v
          sh bundles/multiace-190/test_paxx_1902_mounts.sh
      - name: Compile and test the maintained screen route changes on the build host
        run: |
          set -euo pipefail
          pin=4edbd50feb36e47d072b5cd4e516b9792b8b4ea9
          screen="$RUNNER_TEMP/233-screen"
          mkdir -p "$screen"
          git fetch --quiet --depth=1 origin "$pin"
          git archive "$pin:02-屏幕层/233-screen" | tar -x -C "$screen"
          git -C "$screen/lib/lvgl" apply --include=src/misc/lv_helix_thread_check.h ../../patches/lvgl_thread_check_hook.patch
          git -C "$screen/lib/libhv" apply --include=base/dns_resolv.c --include=base/dns_resolv.h ../../patches/libhv-dns-resolver-fallback.patch
          patch -d "$screen" --batch --fuzz=0 -p1 < bundles/full-system-1902/screen_routes.patch
          bash bundles/full-system-1902/test_screen_routes.sh "$screen"
      - name: Fetch exact released base firmware
        run: |
          mkdir -p inputs
          curl --fail --location --retry 2 --max-time 300 \
            https://github.com/446599/snapfxxker-os/releases/download/v2.1.2-233-paxx8d8af0d.2/U1_233_2.1.2-233-paxx8d8af0d.2_upgrade.bin \
            -o inputs/base.bin
          echo '0d7b4039696a0a3b98df093b58a333fb0de5b5372ab665bf4d6a9d3165b942bf  inputs/base.bin' | sha256sum -c -
      - name: Repack full candidate and verify actual readback
        run: |
          sudo bash bundles/full-system-1902/build.sh inputs/base.bin output
          sudo chown -R "$(id -u):$(id -g)" output
          git rev-parse HEAD > output/SOURCE_COMMIT.txt
          (cd output && sha256sum -c SHA256SUMS.txt)
          cat output/SHA256SUMS.txt
          cat output/SHA256SUMS.txt >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: U1-233-1902.7-filament-save-candidate
          path: output/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
