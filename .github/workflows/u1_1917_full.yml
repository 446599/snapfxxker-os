name: Build complete U1 233 1902.17 automatic park return
on:
  push:
    branches: [codex/1917-auto-park-return]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: u1-1917-full-${{ github.ref }}
  cancel-in-progress: true
jobs:
  full:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Install firmware assembly tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libssl-dev squashfs-tools nginx-core
      - name: Run motion, provider and full-system regression tests
        env:
          PYTHONPATH: bundles/multiace-190
        run: |
          python3 -m unittest discover -s bundles/ace2k-native-slot-exit -v
          python3 -m unittest discover -s bundles/full-system-1902 -v
          python3 -m unittest discover -s bundles/multiace-190 -p 'test_lane*.py' -v
          bash -n bundles/full-system-1902/build_1916.sh
      - name: Fetch the verified 1902.16 artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api /repos/446599/snapfxxker-os/actions/artifacts/15254096265/zip > "$RUNNER_TEMP/base-1916.zip"
      - name: Build and read back the complete upgrade image
        run: |
          sudo bash bundles/full-system-1902/build_1916.sh "$RUNNER_TEMP/base-1916.zip" output 1917
          (cd output && sha256sum -c SHA256SUMS.txt)
          cat output/SHA256SUMS.txt >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: U1-233-1902.17-auto-park-candidate
          path: output/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
